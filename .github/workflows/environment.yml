name: Environment verification

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Frontend typecheck and build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Backend build
        run: bash backend/gradlew --no-daemon -p backend build
      - name: Python tests
        run: |
          python -m pip install --require-hashes -r ai-service/requirements-dev.lock
          cd ai-service
          python -m pytest -q
      - name: Generate temporary local environment
        shell: pwsh
        run: ./scripts/Initialize-Environment.ps1
      - name: Build and start all services
        run: docker compose --env-file .env -f infra/compose.yml up -d --build --wait --wait-timeout 240
      - name: Verify infrastructure and migration replay
        run: python scripts/verify-environment.py
      - name: Stop CI services
        if: always()
        run: docker compose --env-file .env -f infra/compose.yml down
