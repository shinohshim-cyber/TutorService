spring:
  application:
    name: tutor-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  datasource:
    url: ${DB_URL}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    url: ${DB_URL}
    user: ${MIGRATION_DB_USER}
    password: ${MIGRATION_DB_PASSWORD}
    validate-on-migrate: true
    clean-disabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
tutor:
  auth:
    jwt-key: ${AUTH_JWT_KEY}
    jwt-kid: ${AUTH_JWT_KID:local-v1}
    previous-key: ${AUTH_JWT_PREVIOUS_KEY:}
    previous-kid: ${AUTH_JWT_PREVIOUS_KID:local-v0}
    refresh-hmac-key: ${AUTH_REFRESH_HMAC_KEY}
    issuer: tutor-service
    audience: tutor-web
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:18080}
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.SQL: "OFF"
